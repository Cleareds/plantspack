name: Daily Image Variants

# Small WebP copies of new or replaced Storage images, which SmartImg and
# PlaceImage load through srcSet (src/lib/image-variants.ts). Vercel image
# optimisation is off, so without this run new images load at full size.
# Skips images that already have variants; adds files, never deletes.

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'  # >= 22.23.4: CVE-2026-111497 (Brotli decoder)

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Make variants
        run: npx tsx scripts/make-image-variants.ts --limit 3000
