<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlantsPack about slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f6ef;
    --forest: #0a3d14;
    --brand: #0a6a1d;
    --ink: #1d2a1f;
    --moss: #5d6b5f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; background: var(--paper); }
  body { font-family: "Manrope", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  .slide { position: relative; width: 1080px; overflow: hidden; background: var(--paper); display: flex; flex-direction: column; }
  body[data-format="feed"] .slide { height: 1350px; padding: 76px 80px 76px; }
  body[data-format="story"] .slide { height: 1920px; padding: 300px 80px 490px; }

  .wordmark { width: 420px; height: auto; display: block; }

  /* The one bold element: an even dot grid of the world, green where PlantsPack has places. */
  .map { margin: 44px -40px 0; }
  canvas { display: block; width: 1000px; }
  .legend { display: flex; gap: 28px; margin-top: 18px; font-size: 23px; font-weight: 600; color: var(--moss); }
  .legend span { display: inline-flex; align-items: center; gap: 10px; }
  .legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }

  h1 {
    font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800;
    font-size: 74px; line-height: 1.03; letter-spacing: -0.025em; color: var(--forest);
    margin-top: 44px; max-width: 900px;
  }
  .what { font-size: 31px; line-height: 1.42; font-weight: 500; margin-top: 24px; max-width: 900px; }
  .what b { font-weight: 700; color: var(--forest); }
  .who { font-size: 27px; line-height: 1.4; font-weight: 600; color: var(--moss); margin-top: 22px; }

  .get { margin-top: auto; background: var(--forest); color: var(--paper); border-radius: 30px; padding: 26px 32px 26px 26px; display: flex; gap: 20px; align-items: center; justify-content: space-between; }
  .get .left { display: flex; gap: 22px; align-items: center; }
  .get img { width: 84px; height: 84px; border-radius: 20px; background: #fff; }
  .get .l1 { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 36px; line-height: 1.1; }
  .get .l2 { font-size: 23px; font-weight: 600; opacity: .82; margin-top: 6px; }
  .get .url { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 700; font-size: 30px; text-align: right; line-height: 1.25; }
  .get .url span { display: block; font-family: "Manrope", sans-serif; font-weight: 600; font-size: 23px; opacity: .8; }

  body[data-format="story"] .map { margin-top: 36px; }
  body[data-format="story"] h1 { font-size: 78px; margin-top: 34px; }
  body[data-format="story"] .get { margin-top: 36px; }
</style>
</head>
<body data-format="feed">
<div class="slide">
  <img class="wordmark" src="../../../public/plantspack.svg" alt="PlantsPack">
  <div class="map"><canvas id="c"></canvas></div>
  <div class="legend">
    <span><i style="background:#0a6a1d"></i>Places on PlantsPack</span>
    <span><i style="background:#d5dccf"></i>No places yet</span>
  </div>
  <h1>Find vegan food wherever you are.</h1>
  <p class="what" id="what"></p>
  <p class="who">Made by Oleksandra and Anton, an independent team of two.</p>
  <div class="get">
    <div class="left">
      <img src="../../../public/icon-512.png" alt="">
      <div>
        <div class="l1">Get the free app</div>
        <div class="l2">App Store and Google Play</div>
      </div>
    </div>
    <div class="url">plantspack.com<span>Link in bio</span></div>
  </div>
</div>
<script src="data.js"></script>
<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/land-50m.js"></script>
<script>
  const fmt = n => n.toLocaleString('en-US');
  window.render = function (format) {
    document.body.dataset.format = format;
    const D = window.DATA;
    document.getElementById('what').innerHTML =
      `PlantsPack maps <b>${fmt(Math.floor(D.places / 1000) * 1000)}+ places</b> to eat, shop and stay vegan in <b>${D.countries} countries</b>, plus ${fmt(Math.floor(D.recipes / 100) * 100)}+ recipes and a vegan events calendar.`;

    const W = 1000, scale = 2;
    const land = topojson.feature(window.LAND, window.LAND.objects.land);
    // Fit the projection to inhabited latitudes only (no Antarctica, no far Arctic).
    const proj = d3.geoNaturalEarth1().rotate([-10, 0]).fitWidth(W, { type: 'Sphere' });
    const y0 = proj([10, 75])[1], y1 = proj([10, -56])[1];
    const H = Math.ceil(y1 - y0);
    proj.translate([proj.translate()[0], proj.translate()[1] - y0]);

    // Land mask on an offscreen canvas.
    const mask = document.createElement('canvas'); mask.width = W; mask.height = H;
    const mctx = mask.getContext('2d');
    mctx.fillStyle = '#000'; mctx.beginPath(); d3.geoPath(proj, mctx)(land); mctx.fill();
    const md = mctx.getImageData(0, 0, W, H).data;
    const isLand = (x, y) => { const xi = Math.round(x), yi = Math.round(y); return xi >= 0 && yi >= 0 && xi < W && yi < H && md[(yi * W + xi) * 4 + 3] > 0; };

    // Count places per grid cell.
    const step = 9, counts = new Map();
    for (const [lon, lat] of D.pts) {
      const p = proj([lon, lat]); if (!p) continue;
      const gx = Math.round(p[0] / step), gy = Math.round(p[1] / step);
      const k = gx + ',' + gy; counts.set(k, (counts.get(k) || 0) + 1);
    }

    const c = document.getElementById('c');
    c.width = W * scale; c.height = H * scale; c.style.height = H + 'px';
    const ctx = c.getContext('2d'); ctx.scale(scale, scale); ctx.clearRect(0, 0, W, H);
    for (let gy = 0; gy * step <= H; gy++) {
      for (let gx = 0; gx * step <= W; gx++) {
        const x = gx * step, y = gy * step, n = counts.get(gx + ',' + gy) || 0;
        if (!n && !isLand(x, y)) continue;
        if (n) {
          const t = Math.min(1, Math.log(n + 1) / Math.log(400));
          ctx.fillStyle = t > 0.55 ? '#0a3d14' : t > 0.25 ? '#0a6a1d' : '#3f9a52';
          ctx.beginPath(); ctx.arc(x, y, 2.6 + 1.1 * t, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = '#d5dccf';
          ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  };
</script>
</body>
</html>
